# ---------------------------------------------------------------------------
# GROUND TRUTH — synthetic KiwiSaver onboarding A/B experiment.
#
# These are the TRUE parameters used by src/simulate.py to generate the
# synthetic event stream. They are committed on purpose: they let us prove
# that the analysis recovers the effect we injected (see tests/test_recovery.py).
#
# The analysis pipeline (dbt -> notebooks) NEVER reads this file. It is a
# reference oracle only.
# ---------------------------------------------------------------------------
meta:
  written: "2026-10-13"
  owner: "portfolio project"
  description: >
    Baseline + injected-effect parameters for a 14-day, 50/50 experiment on a
    KiwiSaver onboarding funnel. Variant B replaces the base-fund selection
    step with a 3-question risk quiz and an instant recommended fund.

experiment:
  experiment_id: ks_onboarding_v1
  seed: 20261013
  start_date: "2026-09-01"   # synthetic clock
  duration_days: 14
  n_users: 40000
  split:                      # assignment probability by arm
    control: 0.50             # stored in data as variant = 'A'
    variant: 0.50             # stored in data as variant = 'B'

# Conditional step probabilities: P(reach next step | reached this step).
funnel:
  landing_to_started:        {control: 0.62, variant: 0.62}
  started_to_completed_q:    {control: 0.85, variant: 0.85}
  completed_q_to_viewed_sel: {control: 0.95, variant: 0.95}
  viewed_sel_to_selected:    {control: 0.55, variant: 0.620}   # +7.0pp  <-- injected lever
  selected_to_confirmed:     {control: 0.80, variant: 0.76}    # -4.0pp  <-- abandonment guardrail
  confirmed_to_submitted:    {control: 0.90, variant: 0.90}

# Guardrail realities (verified independently in the analysis step).
guardrails:
  # NOTE: abandonment below is expressed as a share of users who SELECTED a fund
  # (= 1 - selected_to_confirmed above). The mart reports it as a share of users
  # who REACHED selection, i.e. viewed_sel_to_selected * (1 - selected_to_confirmed),
  # hence ~0.11 (A) and ~0.15 (B) -- not 0.20 / 0.24. Both are correct; mind the base.
  post_selection_abandonment:   # share of SELECTORS who never confirm
    control: 0.20
    variant: 0.24
  fund_switch_regret_14d:       # share of converters who switch base fund within 14 days
    control: 0.04
    variant: 0.09

# Secondary / commercial metrics (measured among converters).
secondary:
  transfer_balance_prob:        {control: 0.85, variant: 0.85}
  transfer_balance_lognormal:
    median_nzd: 8000             # assumption; skewed, new joiners pull the low tail
    sigma: 1.4                   # -> mean ~= 21.3k NZD
    control_shift: 0.0           # additive log-shift applied to variant, if any
    variant_shift: 0.0
  contribution_setup_30d_prob:  {control: 0.52, variant: 0.52}

# Conversion timing: days from viewed_fund_selection -> submitted_application.
# Truncated to the 7-day measurement window by construction.
timing:
  conversion_delay_days:
    same_session_prob: 0.55      # < 1 hour
    within_1_day_prob: 0.25      # 1-24h
    within_3_days_prob: 0.12     # 1-3d
    within_7_days_prob: 0.08     # 3-7d

# Population composition for the user dimension table.
population:
  is_existing_kiwisaver_prob: 0.70
  device_weights: {ios: 0.52, android: 0.33, web: 0.15}
  channel_weights: {organic: 0.40, paid_social: 0.27, referral: 0.18, email: 0.15}
  age_band_weights: {18-24: 0.22, 25-34: 0.34, 35-44: 0.24, 45-54: 0.13, "55+": 0.07}
  sex_weights: {female: 0.48, male: 0.49, other: 0.03}
  income_band_weights: {"<40k": 0.28, "40-70k": 0.33, "70-100k": 0.24, "100k+": 0.15}
  # Risk profile is correlated with age; shares are marginal fallback weights.
  risk_profile_weights:
    conservative: 0.18
    balanced: 0.27
    growth: 0.31
    high_growth: 0.24
