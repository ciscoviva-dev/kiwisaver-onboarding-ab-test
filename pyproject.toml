[project]
name = "kiwisaver-onboarding-ab-test"
version = "0.1.0"
description = "Bayesian analysis of a synthetic KiwiSaver onboarding A/B experiment (portfolio project)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "duckdb>=1.0",
    "dbt-duckdb>=1.8",
    "matplotlib>=3.8",
    "jupyter>=1.0",
    "jupyterlab>=4.0",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "nbconvert>=7.16",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]
tier3 = [
    "pymc>=5.15",
    "arviz>=0.18",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

